<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7b7bb">
  <title>Open When — For Sumiko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
    <span class="loading-heart" aria-hidden="true">♥</span>
    <span class="loading-message">Getting your little love notes ready…</span>
  </div>

  <main>
    <section class="screen intro-screen is-active" id="introScreen" aria-labelledby="introTitle">
      <div class="intro-content">
        <p class="intro-prelude" id="introPrelude"></p>
        <img class="cat-sticker" id="catSticker" alt="" fetchpriority="high">
        <h1 class="intro-title" id="introTitle"></h1>
        <button class="open-button" id="openButton" type="button"></button>
      </div>
    </section>

    <section class="screen spacer-screen" id="spacerScreen" aria-label="A little parcel for you">
      <button class="spacer-button" id="spacerButton" type="button">
        <span class="spacer-image-wrap image-shadow-wrap">
          <img class="spacer-image" id="spacerImage" alt="" draggable="false">
        </span>
        <span class="click-to-open" id="clickToOpen"></span>
      </button>
    </section>

    <section class="screen main-screen" id="mainScreen" aria-labelledby="mainTitle">
      <div class="main-content">
        <p class="main-eyebrow" id="mainEyebrow"></p>
        <h1 class="main-title" id="mainTitle"></h1>
        <p class="main-subtitle" id="mainSubtitle"></p>
        <div class="envelope-grid" id="envelopeGrid"></div>
        <p class="main-signoff" id="mainSignoff"><span aria-hidden="true">♡</span></p>
      </div>
    </section>
  </main>

  <div class="letter-overlay" id="letterOverlay" aria-hidden="true">
    <div class="letter-backdrop" data-close-letter></div>
    <section class="letter-dialog" id="letterDialog" role="dialog" aria-modal="true" aria-labelledby="letterTitle" tabindex="-1">
      <button class="close-button" id="closeLetterButton" type="button" aria-label="Close letter">×</button>
      <div class="letter-content" id="letterContent"></div>
    </section>
  </div>

  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <div class="announcement" id="announcement" role="status" aria-live="polite"></div>
</body>
</html>
